{% extends "base.html" %}
{% block content %}
<h1>Загрузка акта проверки РСК</h1>

{% if errors %}
<div class="id-form-errors" style="color:var(--c-danger)">{{ errors | join(' ') }}</div>
{% endif %}

{% if not preview %}
<form class="form-box" method="post" action="/rsk/import" enctype="multipart/form-data" style="max-width:500px">
  {# Было: внешний <label> оборачивал span с input+вложенным <label for=...>
     — implicit binding у внешнего label уходит к первому labelable-
     потомку (самому input), а не к видимому смыслу подписи; с вложенным
     label внутри это ещё и невалидная вложенность (найдено 21.09.2026,
     тот же класс дефекта, что и «Ответственный» на /rsk/processing).
     Подпись теперь — свой <label for="act-pdf-input">, не обёртка:
     указывает на тот же input явно, клик по тексту подписи по-прежнему
     открывает диалог выбора файла, тем же штатным способом label+for,
     что и кнопка «Выбрать файл» рядом. #}
  <label for="act-pdf-input" style="display:block">Файл акта (PDF)</label>
  <span class="file-input-row">
    <input type="file" name="act_pdf" accept="application/pdf,.pdf" required id="act-pdf-input" class="file-input-visually-hidden">
    <label for="act-pdf-input" class="file-btn">Выбрать файл</label>
    <span class="file-name" id="act-pdf-filename">Файл не выбран</span>
  </span>
  <button type="submit" style="margin-top:1rem">Разобрать и показать предпросмотр</button>
</form>
<script>
(function () {
  var input = document.getElementById('act-pdf-input');
  var nameEl = document.getElementById('act-pdf-filename');
  if (!input || !nameEl) return;
  input.addEventListener('change', function () {
    nameEl.textContent = input.files && input.files.length ? input.files[0].name : 'Файл не выбран';
  });
})();
</script>
{% else %}

<h3>Предпросмотр — акт {{ preview.act.act_no or '?' }} от {{ preview.act.act_date|fmt_dmy if preview.act.act_date else '?' }}</h3>
<p class="subtitle">Файл: {{ original_name }}. Ничего ещё не записано в базу.</p>

{% if duplicate %}
<div class="flash flash-err">Акт {{ preview.act.act_no }} уже загружен в базу — повторная загрузка отклонена, запись невозможна.</div>
{% endif %}

<div class="kpi-row kpi-small">
  <div class="kpi">
    <div class="kpi-num">{{ preview.records | length }}</div>
    <div class="kpi-label">Позиций в акте</div>
  </div>
  <div class="kpi">
    <div class="kpi-num {{ 'warn' if preview.checks.no_remedy or preview.checks.no_due_date or preview.checks.no_item_no or preview.checks.no_first_act }}">
      {{ preview.checks.no_remedy + preview.checks.no_due_date + preview.checks.no_item_no + preview.checks.no_first_act }}
    </div>
    <div class="kpi-label">Проблем разбора</div>
    <div class="kpi-sub">без мероприятия/срока/№ п/п/акта выявления</div>
  </div>
</div>

<p class="subtitle">Сравнение с текущим реестром открытых нарушений — отождествление по тексту и разделу, не по номеру из акта (номер может измениться между актами).</p>
<div class="kpi-row kpi-small">
  <div class="kpi"><div class="kpi-num ok">{{ diff.new | length }}</div><div class="kpi-label">Новые нарушения</div></div>
  <div class="kpi"><div class="kpi-num ok">{{ diff.removed | length }}</div><div class="kpi-label">Снятые (исчезли из акта)</div></div>
  <div class="kpi"><div class="kpi-num">{{ diff.carried | length }}</div><div class="kpi-label">Перенесено без изменений</div></div>
  <div class="kpi"><div class="kpi-num warn">{{ diff.changed | length }}</div><div class="kpi-label">Изменили формулировку</div></div>
  <div class="kpi"><div class="kpi-num {{ 'warn' if diff.ambiguous }}">{{ diff.ambiguous | length }}</div><div class="kpi-label">Неоднозначные</div></div>
</div>

{% if diff.conflicts %}
<div class="flash flash-err">
  Отмечены «Устранено» в отработке, но снова присутствуют в этом акте — отметка НЕ снимается автоматически, проверьте отработку:
  {% for c in diff.conflicts %}<a href="/rsk/processing?sys_no={{ c.sys_no }}">№{{ c.sys_no }}</a>{{ ', ' if not loop.last }}{% endfor %}
</div>
{% endif %}

<form method="post" action="/rsk/import/confirm" style="margin-top:1rem">
  <input type="hidden" name="token" value="{{ token }}">
  <input type="hidden" name="original_name" value="{{ original_name }}">

  {% if diff.ambiguous %}
  <h3>Неоднозначные соответствия — требуют решения</h3>
  <div class="table-wrap" style="margin-bottom:1rem">
  <table class="data-table">
    <thead><tr><th>Позиция в новом акте</th><th>Решение</th></tr></thead>
    <tbody>
      {% for item in diff.ambiguous %}
      <tr>
        <td class="wrap" style="max-width:420px">{{ item.record.content or '—' }}</td>
        <td class="nowrap">
          <select name="resolve_{{ item.index }}" required>
            <option value="" disabled selected>— выберите —</option>
            {% for c in item.candidates %}
            <option value="{{ c.violation_id }}">№{{ c.sys_no }} ({{ (c.score * 100) | round | int }}%) — {{ (c.content or '')[:60] }}</option>
            {% endfor %}
            <option value="new">Новое нарушение (ни один из вариантов)</option>
          </select>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
  {% endif %}

  {% if diff.new %}
  <h3>Новые нарушения ({{ diff.new | length }})</h3>
  <div class="table-wrap" style="margin-bottom:1rem">
  <table class="data-table">
    <tbody>
      {% for entry in diff.new %}
      <tr><td class="wrap">{{ (entry.record.content or '—')[:160] }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
  {% endif %}

  {% if diff.removed %}
  <h3>Снятые — отсутствуют в этом акте ({{ diff.removed | length }})</h3>
  <div class="table-wrap" style="margin-bottom:1rem">
  <table class="data-table">
    <tbody>
      {% for c in diff.removed %}
      <tr><td class="nowrap"><a href="/rsk/violation/{{ c.sys_no }}">№{{ c.sys_no }}</a></td><td class="wrap">{{ (c.content or '—')[:160] }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
  {% endif %}

  {% if diff.changed %}
  <h3>Изменили формулировку ({{ diff.changed | length }})</h3>
  <div class="table-wrap" style="margin-bottom:1rem">
  <table class="data-table">
    <tbody>
      {% for entry in diff.changed %}
      <tr><td class="nowrap"><a href="/rsk/violation/{{ entry.sys_no }}">№{{ entry.sys_no }}</a></td><td class="wrap">{{ (entry.record.content or '—')[:160] }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
  {% endif %}

  {% if mass_closure %}
  <div class="flash flash-err">
    <label style="display:flex;align-items:center;gap:.5rem;font-weight:600">
      <input type="checkbox" name="confirm_mass_closure" value="1" style="width:auto">
      Подтверждаю: акт снимает {{ closing_count }} из {{ active_total }} активных замечаний
    </label>
  </div>
  {% endif %}

  {% if not duplicate %}
  <button type="submit" data-hotkey-save>Подтвердить и записать в базу</button>
  {% endif %}
  <a href="/rsk/import" class="btn-secondary" style="margin-left:.75rem">Отменить, загрузить другой файл</a>
</form>
{% endif %}
{% endblock %}
